name: Document fetch request
description: Queue retrieval of one complete public source for any retrieval worker.
title: "fetch: "
labels:
  - fetch-request
body:
  - type: markdown
    attributes:
      value: |
        File this when a research block needs a complete paper and this environment cannot verify it. The source may be any public paper. One issue per stable source. Search open issues for that id before filing. This form applies the `fetch-request` label. A body with the same fields and no `fetch-request` label is not filed. If you create the issue through the API, send `"labels": ["fetch-request"]` and read the labels back.

        Code, a program, a supplement, a dataset, or a file offered only by emailing the author uses the help request, not this form.

        A retrieval worker claims the issue, fetches with ordinary tools, and posts an immutable manifest comment. It does not edit literature ledgers and it does not close the issue. The `fetched` label means the file is verified and waiting for ingestion. The research agent then stores the PDF at the conventional local path, commits the manifest and the question screen, and opens a pull request that references this issue. The issue closes after that pull request is merged. Any agent may be the worker or the research agent.

        Identify the source by DOI, arXiv id, canonical URL, archive record id, or a bare other id, plus title, author, and year. A DOI may contain parentheses. Write ordinary https URLs only. Do not paste signed URLs, cookies, or credentials. A preview, a front-matter file, or an unreadable extraction is not a finished question screen.

        Label lifecycle: `fetch-request` to `fetch-claimed`, then `fetched`, `restricted`, `needs-human`, or `not-found`. Exactly one of those labels is on the issue. `fetched` is the ingestion signal. Do not add another label for it. `not-found` means the applicable public routes found no copy and is reopened only when the route catalog gains a new applicable route. The blocker category uses the same names as a manifest `error_category`.
  - type: input
    id: stable_source_id
    attributes:
      label: Stable source ID
      description: DOI, arXiv id, canonical URL, or archive record id. This id stays the same when a mirror URL changes.
      placeholder: 10.1000/example.doi
    validations:
      required: true
  - type: textarea
    id: stable_id_aliases
    attributes:
      label: Other stable IDs
      description: One scheme and value per line. Schemes are doi, arxiv, url, archive_record, campaign_record, and other. other is prefix:value or a bare token with no colon. A PMCID is archive_record pmcid:PMC plus digits.
      placeholder: |
        arxiv 1234.56789
        url https://example.test/paper
  - type: input
    id: title
    attributes:
      label: Title
      description: Title as given by the publisher, repository, or preprint record.
      placeholder: Example paper title
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
      placeholder: Author Name
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: Year
      description: Four-digit publication year.
      placeholder: "2020"
    validations:
      required: true
  - type: dropdown
    id: document_type
    attributes:
      label: Document type
      options:
        - article
        - preprint
        - doctoral_dissertation
        - masters_thesis
        - book
        - report
        - other
    validations:
      required: true
  - type: input
    id: campaign_id
    attributes:
      label: Campaign
      description: Optional. Leave blank when the paper is not part of a campaign. Two or more hyphen-separated segments of letters and digits, spelled as the investigation spells them (unl-sem, L-F102-correlated-residuals, L-F91-c16-unrestricted-width, UNL-SEM-2001). Not a document id.
      placeholder: unl-sem
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: High when the current answer depends on this text. Normal for a campaign gap. Low for a lead that can wait.
      options:
        - low
        - normal
        - high
      default: 1
    validations:
      required: true
  - type: dropdown
    id: blocker_category
    attributes:
      label: Blocker category
      description: Same names as the manifest error_category. A browser that cannot start is browser_host_unavailable, not other. A preview or front-matter file is preview_only. No public copy is not_found. Bot mitigation is not an access restriction.
      options:
        - bot_mitigation
        - http_error
        - browser_host_unavailable
        - timeout
        - network
        - preview_only
        - restricted
        - identity_mismatch
        - incomplete_document
        - extraction_unreadable
        - not_found
        - other
    validations:
      required: true
  - type: textarea
    id: routes_attempted
    attributes:
      label: Routes already attempted
      description: Each line is a catalog route id when known, a method, a durable https URL or stable id, and the result. Omit signed queries and cookies.
      placeholder: |
        doi-resolution@1 curl https://doi.org/10.1000/example.doi -> bot check
        browser-download@1 browser did not start
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: What failed
      description: The concrete failure in this environment, and which text is still needed.
      placeholder: DOI resolution returned a bot check and the browser did not start.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before filing
      options:
        - label: This is a paper. Code, a supplement, a dataset, or a file offered only by emailing the author belongs on a help request.
          required: true
        - label: I searched existing issues for this stable source ID and its aliases.
          required: true
        - label: This form's fetch-request label will be on the issue. I will not file the same body without that label.
          required: true
        - label: This request contains no signed URLs, cookies, or credentials.
          required: true
        - label: Routes already attempted are listed, including bot checks and browser failures.
          required: true
