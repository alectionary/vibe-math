name = "absorbing_complex_bridge"
version = "0.2.0"
defaultTargets = ["AbsorbingComplex"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "5f7b4198d22a9c82e1c698a379334fe128095c82"

[[lean_lib]]
name = "AbsorbingFourTwo"
srcDir = "first-block"
roots = ["FourColumnClassification", "GlobalCounting", "OrderedRoots", "PairEnergy", "PairFormulaCore", "FourCompletions", "PairRootBridge", "CyclicNormalization", "FiniteFourier", "SocketFourier", "SocketIncidence", "CyclicFourierCount", "GramCounterexample12", "SmallQuantumData", "FastQuantumData", "QuantumConstruction", "FanoBlock", "ProjectionObstruction", "HGPIncidence", "HGPPatterns", "HGPCounts", "HGPGramObstruction", "HGPCSS", "HGPSpectral", "SocketCompletion", "CompletionBridge", "IncidenceEquivalence", "QuantumReindex", "GBReflection", "AbsorbingFourTwo"]

[[lean_lib]]
name = "AbsorbingComplex"
roots = ["ClassicalConfiguration", "ClassicalDecomposability", "ComplexCharacter", "ComplexDFT", "ComplexCyclicCount", "ComplexMatrixCount", "ComplexRootFormula", "ComplexConsumer", "ComplexQuantumSockets", "ComplexQuantumWitness", "ComplexQuantumFormula", "AbsorbingComplex"]
