removals: []
design_notes: Counts refer to named source analyses/code families, not unknown plot
  points. Original per-point grids must be recovered before asserting full numerical
  coverage. No fit or simulation has run before this baseline.
resource_policy: Use at most two concurrent CPU processes. Benchmark original software
  first; estimate full cost from measured throughput. Do not launch unbounded runs.
  Any reduced run requires measured cost, attempted settings and explicit incomplete
  verdict.
engine: Exact binary linear algebra and C++ BP+OSD. SEM engines lavaan/OpenMx do not
  implement this quantum decoding model; verify via independent representations and
  pinned original code.
source_access: Browser text available; direct PDF download blocked by network destination
  policy. Figures and source ink still require visual verification.
