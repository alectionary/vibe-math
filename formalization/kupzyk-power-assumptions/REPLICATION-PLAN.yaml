schema_version: 1
dissertation: Kevin A. Kupzyk (2011). The Effects of Simplifying Assumptions in Power Analysis. PhD dissertation, University of Nebraska–Lincoln.
source_locator: sources/kupzyk-2011.pdf
source_record_url: https://digitalcommons.unl.edu/cehsdiss/106/
source_sha256: 368dc575d9f744bf5ca5516873a633691d999fbdd5d19516994c64e10674896a
source_inventory: source-inventory.json
parts:
- id: ch1
  kind: chapter
  label: 'Introduction: planning longitudinal cluster trials (pp. 1–6)'
  plan: Separate the motivating trial-planning problem from original claims and tie the quantitative argument to the four research questions.
  status: replicated
  evidence: notes/claim-inventory.md
- id: ch2
  kind: chapter
  label: Power methods and derivations (pp. 7–67)
  plan: Distinguish prior methods from original comparisons; check the formulas and reported worked examples.
  status: partly
  evidence: results/source-identities.json
  reason: The G*Power example agrees, while the two Optimal Design screen examples differ under the recovered formula.
  run_complete: true
- id: precision
  kind: analysis
  label: Empirical power precision and two-seed demonstration (Figure 4; pp. 59–64)
  plan: Recover the toy experiment, compare the two 500-draw runs, and check the 25,600 and 102,400 draw prescriptions analytically.
  status: partly
  evidence: results/figure4-independent-summary.json
  reason: The count formula agrees. The independent demonstration shows variability but cannot replay the two plotted seeds.
  limit_kind: input_unavailable
  missing_input: The original toy generator and seeds
  looked_in: Chapter II and Figure 4
  reported_to_person:
    date: '2026-11-09'
    channel: Codex chat
    summary: The source streams and masks are unavailable. The user approved the independent R reconstruction.
  sufficient_statistics:
    checked: true
    found: false
    sufficient: false
    what: Published aggregate statistics and design
    why: The printed summaries do not identify the original realization.
- id: ch3
  kind: chapter
  label: Population model and crossed design (pp. 68–83)
  plan: Audit covariance, timing, variance components, treatment rounding, size generation, cumulative dropout, test statistic, and all factor
    crossings against Figure 5 and Appendices A/B.
  status: replicated
  evidence: source-values/figure-5.csv
- id: initial-empirical
  kind: arm
  label: Initial-stage empirical power (Figures 6–8; 54 settings × 25,600 draws)
  headline: true
  design_count: 1382400
  plan: Run all 25,600 intended draws independently in each initial-stage setting; compare digitized power, recording failures and random-stream
    limits.
  status: replicated
  evidence: results/full/empirical.csv
  run_count: 1382400
- id: initial-exemplary
  kind: arm
  label: Initial-stage exemplary power (Figures 6–8; 54 settings)
  headline: true
  design_count: 54
  plan: Compute known-covariance power at J=16,22,28 under source cluster sizes and masks sampled from the reported mechanism; cross-check
    independently.
  status: replicated
  evidence: results/full/exemplary-v2.csv
  run_count: 54
- id: final-exemplary
  kind: arm
  label: Final-stage exemplary power (Figures 9–11 and Table 1; 54 settings)
  headline: true
  design_count: 54
  plan: Compute all final-stage cells at J=13,19,25, subject to source check; independently verify covariance and propagate mask variability.
  status: replicated
  evidence: results/full/fresh-gls-validation.csv
  run_count: 54
- id: formula-od
  kind: arm
  label: Optimal Design formulaic power and sample-size choice with J−2
  headline: true
  plan: Verify both sides of each threshold at the three ICC values, using the documented formula and independent calculation.
  status: replicated
  evidence: results/full/formulaic.csv
- id: formula-bw
  kind: arm
  label: Formulaic between–within degrees of freedom (Equation 4.1)
  headline: true
  plan: Verify Jnt−J−2 in balanced settings, compare formulaic and exemplary power, and treat missing-observation extensions as assumptions
    to test.
  status: replicated
  evidence: results/full/formulaic.csv; results/full/fresh-gls-validation.csv
- id: ch4
  kind: chapter
  label: Results and convergence (pp. 84–98)
  plan: Reconcile figures and tables, assess convergence and boundary behavior, and compare all reported crossed effects.
  status: partly
  evidence: results/full/comparison-summary.json
  reason: The full empirical grid agrees within adjusted bands, while Table 3 and three sample-size thresholds differ at point-estimate scale.
  run_complete: true
- id: rq1
  kind: research_question
  label: Attrition and loss of power (Tables 1–3, Figures 6–11)
  headline: true
  plan: Compare paired 0/5/15 percent interval-attrition contrasts, their heterogeneity and combined sample-size consequences.
  status: replicated
  evidence: source-values/table-2.csv; results/full/paired-contrasts.csv
- id: oversample
  kind: analysis
  label: Attrition oversampling (Table 3)
  plan: Recreate all published conditions and compare added-cluster and retained-power targets; investigate the .88187 value against independent
    GLS and dropout/allocation alternatives.
  status: partly
  evidence: results/full/oversampling-v2.csv; results/full/observation-loss-oversampling.csv
  reason: Oversampling clears 80% throughout, but the published 0.88187 falls below the rerun central predictive interval.
  run_complete: true
- id: rq2
  kind: research_question
  label: Unequal treatment allocation (Tables 1 and 4, Figures 6–11)
  headline: true
  plan: Compare 27 matched allocation contrasts in each initial and final grid, preserving ranges and interactions.
  status: replicated
  evidence: results/full/paired-contrasts.csv
- id: rq3
  kind: research_question
  label: Unequal cluster sizes (Tables 1 and 4, Figures 6–11)
  headline: true
  plan: Check normal and skewed sizes separately against equal sizes at each matched condition, including near-zero losses.
  status: replicated
  evidence: results/full/paired-contrasts.csv; source-values/table-1.csv
- id: rq4
  kind: research_question
  label: ICC moderation (Table 4, Figures 9–11)
  headline: true
  plan: Calculate each violation loss at each ICC; check lowest-ICC ordering and monotonicity separately for each violation.
  status: partly
  evidence: results/full/comparison-summary.json; source-values/table-4.csv
  reason: ICC .05 has the largest mean losses throughout, but skewed-size loss increases between .10 and .15 in both grids.
  run_complete: true
- id: hypothesis-order
  kind: hypothesis
  label: Predicted power-loss ordering (p. 67)
  plan: Test the original expectation that attrition has the largest bias against published and rerun allocation, attrition and cluster-size
    contrasts.
  status: mismatch
  evidence: results/full/paired-contrasts.csv
  reason: The stated hypothesis expects attrition to dominate, while allocation causes the largest mean loss in the published and reconstructed
    designs.
  run_complete: true
- id: thresholds
  kind: analysis
  label: Minimum cluster counts for 80 percent power (Table 5)
  headline: true
  design_count: 54
  plan: Check every reported threshold, including already-sufficient settings and predecessor cluster counts; report mask-sensitive crossings
    and rounding.
  status: partly
  evidence: results/full/threshold-comparison.csv
  run_count: 54
  reason: Fifty-one exact thresholds agree. Three mean-power crossings occur one cluster earlier and are sensitive to dropout masks.
  run_complete: true
- id: ch5
  kind: chapter
  label: Discussion and practical conclusions (pp. 99–112)
  plan: Check claimed consequences, reference-DF choice, and reasons for empirical versus exemplary differences against the component analyses.
  status: partly
  evidence: results/full/appendix-d-comparison.csv; results/full/kenward-roger-summary.csv; results/full/completers-arithmetic.json
  reason: The planning pattern and empirical gap recur. Appendix D includes a material Optimal Design difference at the extreme setting.
  run_complete: true
- id: baseline-50000
  kind: analysis
  label: Independent 50,000-draw baseline follow-up (pp. 89, 106–107)
  design_count: 50000
  plan: Run a distinct 50,000-draw stream at the initial baseline; compare the gap from exemplary power to the main-grid baseline and its
    Monte Carlo uncertainty.
  status: replicated
  evidence: results/full/empirical.csv; outputs/baseline-diagnostic.csv
  run_count: 50000
- id: empirical-gap
  kind: headline
  label: Empirical estimates usually below initial exemplary estimates (pp. 89–90, 106–110)
  plan: Compare all 54 empirical–exemplary pairs to published signs and ranges, and isolate fixed versus refitted variance with a paired
    diagnostic.
  status: replicated
  evidence: results/full/empirical-exemplary-gaps.csv
- id: appendix-a
  kind: analysis
  label: 'Appendix A: empirical SAS implementation'
  plan: Audit source code and seeds, distinguish SAS-specific replay from distributional reconstruction, and verify an independent generator
    and optimizer.
  status: partly
  evidence: rerun/validate_generator.R; rerun/validate_profile.R
  reason: Independent R generator and optimizer checks cover the model, while SAS random streams and execution state are unavailable.
  limit_kind: input_unavailable
  missing_input: Original SAS random-stream state and fitted records
  looked_in: Appendix A, source archive and documented software audit
  reported_to_person:
    date: '2026-11-09'
    channel: Codex chat
    summary: The source streams and masks are unavailable. The user approved the independent R reconstruction.
  sufficient_statistics:
    checked: true
    found: false
    sufficient: false
    what: Published aggregate statistics and design
    why: The printed summaries do not identify the original realization.
- id: appendix-b
  kind: analysis
  label: 'Appendix B: exemplary SAS implementation'
  plan: Extract published frequency arrays, verify sums and placement, and independently reproduce fixed-variance inference and dropout rules.
  status: partly
  evidence: outputs/normsizes.csv; outputs/skewsizes.csv; results/full/fresh-gls-validation.csv
  reason: Size frequencies and independent covariance calculations agree. Original individual dropout masks are unavailable.
  limit_kind: input_unavailable
  missing_input: Original unit-level dropout masks
  looked_in: Appendix B and original PDF supporting records
  reported_to_person:
    date: '2026-11-09'
    channel: Codex chat
    summary: The source streams and masks are unavailable. The user approved the independent R reconstruction.
  sufficient_statistics:
    checked: true
    found: false
    sufficient: false
    what: Published aggregate statistics and design
    why: The printed summaries do not identify the original realization.
- id: appendix-c
  kind: analysis
  label: 'Appendix C: convergence, fitted variance and interaction diagnostics'
  plan: Save per-cell estimates and boundary counts for every published component; compare with population and published summaries and check
    ICC identities where applicable.
  status: replicated
  evidence: results/full/appendix-c-comparison.csv
- id: null-baseline
  kind: condition
  label: 'Appendix D.1: baseline Type I error across five denominator rules'
  plan: Simulate the first initial-stage cell under the null at the source count where verifiable and evaluate J−2, between–within, containment,
    Satterthwaite and Kenward–Roger.
  status: partly
  evidence: results/full/appendix-d-comparison.csv; source-values/table-D.1.csv
  run_complete: true
  reason: The broad Bradley classification agrees, while the between-within and containment point estimates move onto or inside the tighter
    Serlin interval.
- id: null-extreme
  kind: condition
  label: 'Appendix D.2: extreme-cell Type I error across five denominator rules'
  plan: Simulate the last initial-stage cell under the null at the source count where verifiable, evaluate the same rules and audit criteria
    against source intervals.
  status: partly
  evidence: results/full/appendix-d2-df-sweep.csv; results/full/appendix-d-comparison.csv
  reason: At the extreme cell the Optimal Design rule has materially higher power and higher null rejection in R than the printed rates.
  run_complete: true
- id: practical-verdict
  kind: headline
  label: Planning with attrition and unequal assignment versus unequal sizes
  plan: Synthesize the four research questions and threshold checks without conflating initial empirical and final exemplary evidence.
  status: replicated
  evidence: results/full/paired-contrasts.csv; results/full/threshold-comparison.csv
removals: []
